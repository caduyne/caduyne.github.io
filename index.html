```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho lưu trữ của Duy</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Baloo 2", sans-serif;
      color: white;

      /* Hình nền */
      background:
        linear-gradient(rgba(17, 19, 53, 0.25),
                        rgba(17, 19, 53, 0.35)),
        url("background.jpg") center center / cover fixed no-repeat;
    }

    /* Tiêu đề góc trái */
    .header {
      padding: 18px 5.8%;
    }

    .header h1 {
      display: inline-block;
      margin: 0;
      font-size: 25px;
      font-weight: 800;
      text-shadow: 0 0 12px white;
    }

    .header .line {
      width: 190px;
      height: 3px;
      margin-top: 2px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 10px;
    }

    /* Khu vực các biểu tượng */
    .apps {
      width: 88%;
      margin: 55px auto 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6.5%;
    }

    /* Ô kính mờ */
    .app-card {
      min-height: 236px;
      padding: 10px;
      border-radius: 25px;
      background: rgba(22, 22, 65, 0.60);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      text-decoration: none;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: 0.25s ease;
    }

    .app-card:hover {
      transform: translateY(-7px) scale(1.02);
      background: rgba(35, 35, 85, 0.78);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .app-name {
      margin: 0 0 15px;
      font-size: clamp(21px, 3vw, 32px);
      font-weight: 800;
      text-shadow: 0 0 10px white;
    }

    /* Biểu tượng */
    .app-icon {
      width: 114px;
      height: 114px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 53px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .canva {
      background: linear-gradient(145deg, #00c4cc, #7d2ae8 85%);
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 30px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }

    .locket {
      background: #ffb900;
      color: #b87900;
    }

    .youtube {
      background: #ff0033;
      color: white;
    }

    .github {
      background: #222222;
      color: white;
    }

    .discord {
      background: #5865f2;
      color: white;
    }

    /* Dòng chữ phía dưới */
    .message {
      width: 84%;
      min-height: 155px;
      margin: 178px auto 50px;
      padding: 30px 20px;
      border-radius: 25px;
      background: rgba(22, 22, 65, 0.62);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(27px, 5vw, 52px);
      font-weight: 800;
      text-shadow: 0 0 12px white;
    }

    /* Hiển thị đẹp trên điện thoại */
    @media (max-width: 600px) {
      .apps {
        width: 88%;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 35px;
      }

      .app-card {
        min-height: 190px;
        border-radius: 20px;
      }

      .app-icon {
        width: 85px;
        height: 85px;
        font-size: 42px;
      }

      .canva {
        font-size: 24px;
      }

      .message {
        margin-top: 85px;
        min-height: 120px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>kho lưu trữ</h1>
    <div class="line"></div>
  </header>

  <main>
    <section class="apps">

      <!-- Ô 1: Canva -->
      <a class="app-card"
         href="https://canva.link/a3vvxjqc5ivuntm"
         target="_blank"
         rel="noopener noreferrer">
        <h2 class="app-name">canva</h2>
        <div class="app-icon canva">Canva</div>
      </a>

      <!-- Ô 2: Locket -->
      <a class="app-card"
         href="https://locket.cam/kduya"
         target="_blank"
         rel="noopener noreferrer">
        <h2 class="app-name">locket</h2>
        <div class="app-icon locket">♥</div>
      </a>

      <!-- Ô 3: YouTube -->
      <a class="app-card"
         href="https://www.youtube.com/"
         target="_blank"
         rel="noopener noreferrer">
        <h2 class="app-name">youtube</h2>
        <div class="app-icon youtube">▶</div>
      </a>

      <!-- Ô 4: GitHub -->
      <a class="app-card"
         href="https://github.com/"
         target="_blank"
         rel="noopener noreferrer">
        <h2 class="app-name">github</h2>
        <div class="app-icon github">⌘</div>
      </a>

      <!-- Ô 5: Discord -->
      <a class="app-card"
         href="https://discord.com/app"
         target="_blank"
         rel="noopener noreferrer">
        <h2 class="app-name">discord</h2>
        <div class="app-icon discord">☁</div>
      </a>

      <!-- Ô 6: Đổi thành ứng dụng của bạn -->
      <a class="app-card"
         href="https://www.google.com/"
         target="_blank"
         rel="noopener noreferrer">
        <h2 class="app-name">my link</h2>
        <div class="app-icon"
             style="background: rgba(255,255,255,0.2);">+</div>
      </a>

    </section>

    <section class="message">
      Chả có gì ở đây đâu
    </section>
  </main>

</body>
</html>
